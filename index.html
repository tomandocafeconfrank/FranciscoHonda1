<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francisco Virtual | Honda Angelópolis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090909;
      --panel: #111111;
      --panel-2: #181818;
      --border: #292929;
      --text: #ffffff;
      --muted: #a7a7a7;
      --honda: #e10600;
      --green: #22c55e;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }

    /* HEADER */
    header {
      height: 68px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #101010;
      flex-shrink: 0;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .brand span {
      color: var(--honda);
    }

    .online {
      color: var(--green);
      font-size: 12px;
      border: 1px solid rgba(34, 197, 94, .3);
      background: rgba(34, 197, 94, .08);
      padding: 6px 10px;
      border-radius: 20px;
    }

    /* CHAT */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        radial-gradient(circle at 20% 0%, rgba(225, 6, 0, .10), transparent 34%),
        var(--bg);
    }

    .message {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      animation: appear .18s ease-out;
    }

    .assistant {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: var(--honda);
      border-bottom-right-radius: 5px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* OPTIONS */
    .optionsArea {
      border-top: 1px solid var(--border);
      background: #101010;
      padding: 16px;
      flex-shrink: 0;
    }

    .optionHint {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option {
      appearance: none;
      border: 1px solid #363636;
      background: #1a1a1a;
      color: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: .18s ease;
    }

    .option:hover {
      border-color: var(--honda);
      background: #202020;
      transform: translateY(-1px);
    }

    .option.primary {
      background: var(--honda);
      border-color: var(--honda);
    }

    .option.secondary {
      color: #d2d2d2;
    }

    .restart {
      margin-top: 10px;
      background: transparent;
      border: 0;
      color: #777;
      font-size: 11px;
      cursor: pointer;
      padding: 4px;
    }

    .restart:hover {
      color: #fff;
    }

    /* MOBILE */
    @media (max-width: 650px) {
      body {
        align-items: stretch;
      }

      .app {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: 0;
      }

      header {
        padding: 0 15px;
      }

      .messages {
        padding: 18px 14px;
      }

      .message {
        max-width: 90%;
      }

      .optionsArea {
        padding: 12px;
      }

      .option {
        width: 100%;
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="brand">
        Francisco García | <span>Honda Angelópolis</span>
      </div>

      <div class="online">
        ● Francisco Virtual
      </div>
    </header>

    <section class="chat">

      <div id="messages" class="messages"></div>

      <div class="optionsArea">
        <div class="optionHint" id="optionHint">
          Selecciona una opción para continuar 👇🏻
        </div>

        <div id="options" class="options"></div>

        <button class="restart" onclick="reiniciar()">
          ↻ Empezar de nuevo
        </button>
      </div>

    </section>

  </main>


<script>

/*
=========================================================
 FRANCISCO VIRTUAL
 PARTE 1 | EXPERIENCIA GUIADA
=========================================================

OBJETIVO DE ESTA PARTE:

Crear una experiencia sencilla donde el cliente NO
necesita escribir.

El cliente principalmente selecciona opciones.

Esta versión NO incluye todavía:

- Cerebro Honda completo
- Fichas técnicas
- Diferencias entre versiones
- Precios reales
- Promociones
- WhatsApp
- Notion
- CRM
- IA externa

Eso pertenece a la PARTE 2.

=========================================================
*/


/* ------------------------------------------------------
   ESTADO DEL CLIENTE
------------------------------------------------------ */

const cliente = {

  tipoVehiculo: null,

  uso: null,

  pasajeros: null,

  prioridad: null,

  modeloSugerido: null

};


/* ------------------------------------------------------
   ELEMENTOS
------------------------------------------------------ */

const messages = document.getElementById("messages");
const options = document.getElementById("options");
const optionHint = document.getElementById("optionHint");


/* ------------------------------------------------------
   UTILIDADES
------------------------------------------------------ */

function mensaje(texto, tipo = "assistant") {

  const elemento = document.createElement("div");

  elemento.className = `message ${tipo}`;

  elemento.textContent = texto;

  messages.appendChild(elemento);

  messages.scrollTop = messages.scrollHeight;
}


function mostrarOpciones(lista) {

  options.innerHTML = "";

  lista.forEach((opcion) => {

    const boton = document.createElement("button");

    boton.className = "option";

    if (opcion.primary) {
      boton.classList.add("primary");
    }

    if (opcion.secondary) {
      boton.classList.add("secondary");
    }

    boton.textContent = opcion.label;

    boton.onclick = () => {

      mensaje(opcion.label, "user");

      setTimeout(() => {

        opcion.accion();

      }, 220);

    };

    options.appendChild(boton);

  });

}


function siguiente(texto, lista) {

  mensaje(texto);

  mostrarOpciones(lista);

}


/* ------------------------------------------------------
   INICIO
------------------------------------------------------ */

function iniciar() {

  messages.innerHTML = "";

  cliente.tipoVehiculo = null;
  cliente.uso = null;
  cliente.pasajeros = null;
  cliente.prioridad = null;
  cliente.modeloSugerido = null;

  optionHint.textContent =
    "Selecciona una opción para continuar 👇🏻";

  siguiente(
    `¡Hola! 👋🏻 Soy el asistente virtual de Francisco, de Honda Angelópolis.

Estoy aquí para ayudarte a conocer los Honda sin enredos y sin aventarte el catálogo completo de golpe 😂

¿Qué traes en mente?`,
    [
      {
        label: "🚙 Quiero una camioneta",
        primary: true,
        accion: elegirCamioneta
      },
      {
        label: "🚗 Quiero un auto",
        accion: elegirAuto
      },
      {
        label: "💰 Quiero conocer precios",
        accion: conocerPrecios
      },
      {
        label: "🔄 Quiero cambiar mi auto",
        accion: cambiarAuto
      },
      {
        label: "🤔 Solo estoy viendo",
        accion: soloEstoyViendo
      }
    ]
  );
}


/* ------------------------------------------------------
   CAMIONETA
------------------------------------------------------ */

function elegirCamioneta() {

  cliente.tipoVehiculo = "camioneta";

  siguiente(
    `Va 👌🏻

Para recomendarte algo que realmente tenga sentido, dime:

¿Para qué la necesitas principalmente?`,
    [
      {
        label: "👨‍👩‍👧‍👦 Familia",
        accion: elegirFamilia
      },
      {
        label: "🏙️ Uso diario",
        accion: usoDiario
      },
      {
        label: "🛣️ Viajes / carretera",
        accion: usoCarretera
      },
      {
        label: "💼 Trabajo",
        accion: usoTrabajo
      }
    ]
  );
}


/* ------------------------------------------------------
   AUTO
------------------------------------------------------ */

function elegirAuto() {

  cliente.tipoVehiculo = "auto";

  siguiente(
    `Va, vamos a aterrizarlo. 👌🏻

¿Para qué lo usarías principalmente?`,
    [
      {
        label: "🏙️ Uso diario",
        accion: usoDiario
      },
      {
        label: "👨‍👩‍👧‍👦 Familia",
        accion: elegirFamilia
      },
      {
        label: "🛣️ Viajes / carretera",
        accion: usoCarretera
      },
      {
        label: "✨ Quiero algo más equipado",
        accion: prioridadEquipamiento
      }
    ]
  );
}


/* ------------------------------------------------------
   USOS
------------------------------------------------------ */

function usoDiario() {

  cliente.uso = "diario";

  siguiente(
    `Perfecto, principalmente para uso diario. 👌🏻

Ahora dime qué te importa más en tu próximo Honda:`,
    opcionesPrioridad()
  );
}


function usoCarretera() {

  cliente.uso = "carretera";

  siguiente(
    `Va, entonces la carretera sí es importante. 🛣️

¿Qué quieres priorizar?`,
    opcionesPrioridad()
  );
}


function usoTrabajo() {

  cliente.uso = "trabajo";

  siguiente(
    `Perfecto. Si va a trabajar contigo, quiero que prioricemos lo que realmente vas a aprovechar. 👌🏻

¿Qué te importa más?`,
    opcionesPrioridad()
  );
}


/* ------------------------------------------------------
   FAMILIA
------------------------------------------------------ */

function elegirFamilia() {

  siguiente(
    `Perfecto. 👌🏻

¿Cuántas personas viajan normalmente contigo?`,
    [
      {
        label: "👤 2-3 personas",
        accion: pasajeros3
      },
      {
        label: "👨‍👩‍👧‍👦 4-5 personas",
        accion: pasajeros5
      },
      {
        label: "👨‍👩‍👧‍👦 6-7 personas",
        accion: pasajeros7
      }
    ]
  );
}


function pasajeros3() {

  cliente.pasajeros = "2-3";

  siguiente(
    `Perfecto, 2-3 personas. 👌🏻

¿Qué pesa más para ti?`,
    opcionesPrioridad()
  );
}


function pasajeros5() {

  cliente.pasajeros = "4-5";

  siguiente(
    `Va, 4-5 personas. 👌🏻

¿Qué pesa más para ti?`,
    opcionesPrioridad()
  );
}


function pasajeros7() {

  cliente.pasajeros = "6-7";

  siguiente(
    `Va, 6-7 personas. 👌🏻

Aquí sí quiero cuidar mucho el espacio disponible.

¿Qué pesa más para ti?`,
    opcionesPrioridad()
  );
}


/* ------------------------------------------------------
   PRIORIDADES
------------------------------------------------------ */

function opcionesPrioridad() {

  return [
    {
      label: "⛽ Que gaste poco",
      accion: prioridadRendimiento
    },
    {
      label: "🛡️ Seguridad",
      accion: prioridadSeguridad
    },
    {
      label: "📦 Espacio",
      accion: prioridadEspacio
    },
    {
      label: "✨ Equipamiento",
      accion: prioridadEquipamiento
    },
    {
      label: "💰 Cuidar la mensualidad",
      accion: prioridadMensualidad
    }
  ];

}


function prioridadRendimiento() {

  cliente.prioridad = "rendimiento";

  recomendar();
}


function prioridadSeguridad() {

  cliente.prioridad = "seguridad";

  recomendar();
}


function prioridadEspacio() {

  cliente.prioridad = "espacio";

  recomendar();
}


function prioridadEquipamiento() {

  cliente.prioridad = "equipamiento";

  recomendar();
}


function prioridadMensualidad() {

  cliente.prioridad = "mensualidad";

  recomendar();
}


/* ------------------------------------------------------
   RECOMENDACIÓN
------------------------------------------------------

IMPORTANTE:

Aquí NO estamos inventando precios ni especificaciones.

La recomendación es solamente una primera orientación.

En la PARTE 2 conectaremos el cerebro Honda para que
pueda explicar versiones, equipamiento y diferencias.
------------------------------------------------------ */

function recomendar() {

  let modelo = "";

  let razon = "";

  if (cliente.tipoVehiculo === "camioneta") {

    if (cliente.pasajeros === "6-7") {

      modelo = "BR-V";

      razon =
        "por la necesidad de llevar más pasajeros y priorizar espacio familiar";

    } else if (cliente.prioridad === "rendimiento") {

      modelo = "HR-V";

      razon =
        "porque estás priorizando el uso diario y el consumo";

    } else if (cliente.prioridad === "espacio") {

      modelo = "CR-V";

      razon =
        "porque el espacio es una de tus prioridades principales";

    } else {

      modelo = "CR-V";

      razon =
        "porque buscas una camioneta familiar y todavía necesitamos afinar qué versión te conviene";

    }

  } else {

    if (cliente.prioridad === "rendimiento") {

      modelo = "CITY";

      razon =
        "porque estás priorizando el uso diario y el rendimiento";

    } else {

      modelo = "CIVIC";

      razon =
        "porque buscas un auto y podemos revisar una opción más completa dentro de la gama";

    }

  }

  cliente.modeloSugerido = modelo;

  siguiente(
    `Va, ya tengo una idea mucho más clara de lo que buscas. 👌🏻

Por lo que me dijiste, yo empezaría revisando el ${modelo} ${razon}.

Ojo: esto es una primera orientación, no significa que sea automáticamente la única opción. La idea es comparar antes de decidir.

¿Qué quieres hacer ahora?`,
    [
      {
        label: `🔎 Conocer ${modelo}`,
        primary: true,
        accion: conocerModelo
      },
      {
        label: "🔄 Ver otra opción",
        accion: verOtraOpcion
      },
      {
        label: "💰 Quiero hablar de precio",
        accion: conocerPrecios
      }
    ]
  );

}


/* ------------------------------------------------------
   MODELO
------------------------------------------------------ */

function conocerModelo() {

  mensaje(
    `Perfecto. 🚗

Aquí es donde entra la segunda parte del proyecto.

En la siguiente versión, Francisco Virtual podrá explicarte:

• Versiones disponibles
• Diferencias entre versiones
• Equipamiento
• Seguridad
• Tecnología
• Características importantes
• Qué versión podría tener más sentido para lo que buscas

Por ahora estamos probando únicamente el recorrido inicial. 👌🏻`
  );

  optionHint.textContent =
    "Parte 1 terminada. Puedes reiniciar para probar otro recorrido.";

  mostrarOpciones([
    {
      label: "↻ Probar otra vez",
      primary: true,
      accion: reiniciar
    }
  ]);

}


/* ------------------------------------------------------
   OTRAS OPCIONES
------------------------------------------------------ */

function verOtraOpcion() {

  siguiente(
    `Claro. 👌🏻

Podemos explorar otra opción antes de decidir.`,
    [
      {
        label: "🚙 Ver otra camioneta",
        accion: elegirCamioneta
      },
      {
        label: "🚗 Ver un auto",
        accion: elegirAuto
      },
      {
        label: "↻ Empezar desde cero",
        accion: reiniciar
      }
    ]
  );

}


function conocerPrecios() {

  cliente.prioridad = "precio";

  siguiente(
    `Claro. 💰

Para no darte un precio fuera de contexto, primero quiero saber qué estás buscando.

Así después podemos revisar la opción y versión correctas.`,
    [
      {
        label: "🚙 Camioneta",
        accion: elegirCamioneta
      },
      {
        label: "🚗 Auto",
        accion: elegirAuto
      },
      {
        label: "🤷🏻 Todavía no sé",
        accion: noSeTodavia
      }
    ]
  );

}


function noSeTodavia() {

  siguiente(
    `No pasa nada 😂.

Para eso estoy yo.

Vamos por lo más fácil: ¿qué quieres que haga tu próximo coche?`,
    opcionesPrioridad()
  );

}


function cambiarAuto() {

  cliente.tipoVehiculo = "cambio";

  siguiente(
    `Va. Si vas a cambiar tu auto, primero quiero saber qué quieres mejorar.

¿Qué es lo que más te importa cambiar?`,
    [
      {
        label: "⛽ Consumo",
        accion: prioridadRendimiento
      },
      {
        label: "📦 Espacio",
        accion: prioridadEspacio
      },
      {
        label: "🛡️ Seguridad",
        accion: prioridadSeguridad
      },
      {
        label: "✨ Equipamiento",
        accion: prioridadEquipamiento
      },
      {
        label: "💰 Mensualidad",
        accion: prioridadMensualidad
      }
    ]
  );

}


function soloEstoyViendo() {

  siguiente(
    `Sin problema. 😄

Aquí nadie te va a corretear para venderte algo.

Puedes conocer opciones con calma y cuando tengas una idea más clara, seguimos desde ahí.`,
    [
      {
        label: "🚙 Ver camionetas",
        accion: elegirCamioneta
      },
      {
        label: "🚗 Ver autos",
        accion: elegirAuto
      },
      {
        label: "↻ Empezar de nuevo",
        accion: reiniciar
      }
    ]
  );

}


/* ------------------------------------------------------
   REINICIAR
------------------------------------------------------ */

function reiniciar() {

  cliente.tipoVehiculo = null;
  cliente.uso = null;
  cliente.pasajeros = null;
  cliente.prioridad = null;
  cliente.modeloSugerido = null;

  iniciar();

}


/* ------------------------------------------------------
   ARRANQUE
------------------------------------------------------ */

iniciar();

</script>

</body>
</html>
